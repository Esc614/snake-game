<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .game-container {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    color: #e0e0ff;
  }
  .header h1 { font-size: 24px; letter-spacing: 2px; }
  .stats { display: flex; gap: 24px; font-size: 16px; }
  .stats span { background: rgba(255,255,255,0.08); padding: 6px 16px; border-radius: 20px; }
  .stats .score { color: #ffd700; font-weight: bold; }
  canvas {
    display: block;
    margin: 0 auto;
    border-radius: 16px;
    background: #1a1a2e;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 18px;
  }
  .controls button {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: #e0e0ff;
    padding: 10px 28px;
    border-radius: 14px;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .controls button:hover {
    background: rgba(255,255,255,0.18);
    transform: translateY(-2px);
  }
  .controls button.restart { background: rgba(255,71,87,0.25); border-color: rgba(255,71,87,0.3); }
  .controls button.restart:hover { background: rgba(255,71,87,0.4); }
  .mobile-dpad {
    display: none;
    margin-top: 18px;
    justify-content: center;
  }
  .dpad-grid {
    display: grid;
    grid-template-columns: 64px 64px 64px;
    grid-template-rows: 64px 64px 64px;
    gap: 4px;
  }
  .dpad-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    color: #e0e0ff;
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }
  .dpad-btn:active { background: rgba(255,255,255,0.2); }
  .dpad-empty { visibility: hidden; }
  @media (pointer: coarse) {
    .mobile-dpad { display: flex; }
  }
  @media (max-width: 500px) {
    .game-container { padding: 16px; border-radius: 16px; }
    .header h1 { font-size: 18px; }
    .stats { gap: 12px; font-size: 14px; }
    .controls button { padding: 8px 18px; font-size: 13px; }
  }
  .game-over-overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.65);
    border-radius: 16px;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: white;
    backdrop-filter: blur(4px);
  }
  .game-over-overlay.show { display: flex; }
  .game-over-overlay h2 { font-size: 36px; margin-bottom: 8px; }
  .game-over-overlay p { font-size: 18px; color: #ffd700; }
  .canvas-wrapper {
    position: relative;
    display: inline-block;
  }
</style>
</head>
<body>

<div class="game-container">
  <div class="header">
    <h1>🐍 贪吃蛇</h1>
    <div class="stats">
      <span>🏆 最高 <span id="highScore">0</span></span>
      <span>⭐ 得分 <span id="score">0</span></span>
    </div>
  </div>

  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="game-over-overlay" id="gameOverOverlay">
      <h2>💀 游戏结束</h2>
      <p>得分: <span id="finalScore">0</span></p>
    </div>
  </div>

  <div class="controls">
    <button onclick="restartGame()" class="restart">🔄 重新开始</button>
    <button onclick="togglePause()">⏸️ 暂停/继续</button>
  </div>

  <div class="mobile-dpad">
    <div class="dpad-grid">
      <div class="dpad-empty"></div>
      <button class="dpad-btn" data-dir="up">▲</button>
      <div class="dpad-empty"></div>
      <button class="dpad-btn" data-dir="left">◀</button>
      <button class="dpad-btn" data-dir="down">▼</button>
      <button class="dpad-btn" data-dir="right">▶</button>
    </div>
  </div>
</div>

<script>
// ======================== 配置 ========================
const GRID_SIZE = 20;          // 20×20 网格
const CELL_SIZE = 20;          // 像素
const TICK_INTERVAL_MS = 150;  // 毫秒

// ======================== DOM 引用 ========================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const finalScoreEl = document.getElementById('finalScore');
const overlay = document.getElementById('gameOverOverlay');

// ======================== 状态 ========================
let snake = [];               // [{x, y}, ...] 蛇头在前
let food = null;              // {x, y}
let direction = 'right';      // 当前移动方向
let nextDirection = 'right';  // 缓冲方向
let score = 0;
let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
let gameRunning = false;
let paused = false;
let gameLoop = null;
let isGameOver = false;

highScoreEl.textContent = highScore;

// ======================== 工具函数 ========================
function randomInt(max) {
  return Math.floor(Math.random() * max);
}

function randomFood() {
  // 确保食物不生成在蛇身上
  const occupied = new Set(snake.map(c => `${c.x},${c.y}`));
  const free = [];
  for (let x = 0; x < GRID_SIZE; x++) {
    for (let y = 0; y < GRID_SIZE; y++) {
      if (!occupied.has(`${x},${y}`)) free.push({ x, y });
    }
  }
  if (free.length === 0) return null; // 蛇已占满全部格子 → 胜利
  return free[randomInt(free.length)];
}

function initGame() {
  // 蛇初始长度 3，水平放置
  const midY = Math.floor(GRID_SIZE / 2);
  snake = [
    { x: 5, y: midY },
    { x: 4, y: midY },
    { x: 3, y: midY },
  ];
  direction = 'right';
  nextDirection = 'right';
  score = 0;
  isGameOver = false;
  paused = false;
  scoreEl.textContent = '0';
  overlay.classList.remove('show');
  food = randomFood();
}

// ======================== 绘制 ========================
function draw() {
  ctx.clearRect(0, 0, 400, 400);

  // ----- 网格线（极淡） -----
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= GRID_SIZE; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL_SIZE, 0);
    ctx.lineTo(i * CELL_SIZE, 400);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * CELL_SIZE);
    ctx.lineTo(400, i * CELL_SIZE);
    ctx.stroke();
  }

  // ----- 食物 -----
  if (food) {
    const fx = food.x * CELL_SIZE + CELL_SIZE/2;
    const fy = food.y * CELL_SIZE + CELL_SIZE/2;
    // 发光
    ctx.shadowColor = '#ff4757';
    ctx.shadowBlur = 18;
    // 苹果
    ctx.beginPath();
    ctx.arc(fx, fy, CELL_SIZE/2 - 2, 0, Math.PI * 2);
    ctx.fillStyle = '#ff4757';
    ctx.fill();
    // 高光
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(fx - 3, fy - 3, 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fill();
  }

  // ----- 蛇 -----
  for (let i = 0; i < snake.length; i++) {
    const seg = snake[i];
    const x = seg.x * CELL_SIZE;
    const y = seg.y * CELL_SIZE;
    const pad = i === 0 ? 0 : 1; // 蛇头占满格子

    // 蛇头渐变
    const ratio = i / snake.length;
    const r = Math.round(80 + (100 - 80) * ratio);
    const g = Math.round(200 + (160 - 200) * ratio);
    const b = Math.round(80 + (100 - 80) * ratio);

    ctx.shadowColor = 'rgba(0,255,100,0.25)';
    ctx.shadowBlur = i === 0 ? 12 : 4;

    // 圆角矩形
    const radius = i === 0 ? 6 : 4;
    const cx = x + pad;
    const cy = y + pad;
    const w = CELL_SIZE - pad * 2;
    const h = CELL_SIZE - pad * 2;
    ctx.beginPath();
    ctx.moveTo(cx + radius, cy);
    ctx.lineTo(cx + w - radius, cy);
    ctx.quadraticCurveTo(cx + w, cy, cx + w, cy + radius);
    ctx.lineTo(cx + w, cy + h - radius);
    ctx.quadraticCurveTo(cx + w, cy + h, cx + w - radius, cy + h);
    ctx.lineTo(cx + radius, cy + h);
    ctx.quadraticCurveTo(cx, cy + h, cx, cy + h - radius);
    ctx.lineTo(cx, cy + radius);
    ctx.quadraticCurveTo(cx, cy, cx + radius, cy);
    ctx.closePath();

    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fill();

    // 蛇头眼睛
    if (i === 0) {
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'white';
      let ex1, ey1, ex2, ey2;
      switch (direction) {
        case 'up':    ex1=6; ey1=5;  ex2=14; ey2=5;  break;
        case 'down':  ex1=6; ey1=13; ex2=14; ey2=13; break;
        case 'left':  ex1=5; ey1=6;  ex2=5;  ey2=14; break;
        case 'right': ex1=13; ey1=6; ex2=13; ey2=14; break;
      }
      ctx.beginPath(); ctx.arc(x+ex1, y+ey1, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+ex2, y+ey2, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.arc(x+ex1, y+ey1, 1.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+ex2, y+ey2, 1.2, 0, Math.PI*2); ctx.fill();
    }
  }

  ctx.shadowBlur = 0;
}

// ======================== 游戏逻辑 ========================
function tick() {
  if (paused || isGameOver) return;

  // 应用缓冲方向
  direction = nextDirection;

  // 计算新蛇头
  const head = snake[0];
  let newHead = { ...head };
  switch (direction) {
    case 'up':    newHead.y--; break;
    case 'down':  newHead.y++; break;
    case 'left':  newHead.x--; break;
    case 'right': newHead.x++; break;
  }

  // 检查撞墙
  if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
    endGame();
    return;
  }

  // 检查撞自身（注意：蛇尾会移动，所以排除最后一个格子）
  const willEat = food && newHead.x === food.x && newHead.y === food.y;
  const bodyToCheck = willEat ? snake : snake.slice(0, -1);
  if (bodyToCheck.some(s => s.x === newHead.x && s.y === newHead.y)) {
    endGame();
    return;
  }

  // 移动蛇
  snake.unshift(newHead);
  if (willEat) {
    score++;
    scoreEl.textContent = score;
    food = randomFood();
    if (!food) {
      // 蛇占满格子 → 胜利
      endGame(true);
      return;
    }
  } else {
    snake.pop();
  }

  draw();
}

function endGame(win = false) {
  isGameOver = true;
  gameRunning = false;
  if (gameLoop) {
    clearInterval(gameLoop);
    gameLoop = null;
  }
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snakeHighScore', highScore);
    highScoreEl.textContent = highScore;
  }
  finalScoreEl.textContent = score;
  if (win) {
    document.querySelector('#gameOverOverlay h2').textContent = '🎉 你赢了！';
  } else {
    document.querySelector('#gameOverOverlay h2').textContent = '💀 游戏结束';
  }
  overlay.classList.add('show');
}

function restartGame() {
  if (gameLoop) clearInterval(gameLoop);
  initGame();
  gameRunning = true;
  draw();
  gameLoop = setInterval(tick, TICK_INTERVAL_MS);
}

function togglePause() {
  if (!gameRunning || isGameOver) return;
  paused = !paused;
}

// ======================== 键盘控制 ========================
document.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
    e.preventDefault();
  }

  if (!gameRunning || isGameOver) return;

  const map = {
    'ArrowUp':    'up',
    'ArrowDown':  'down',
    'ArrowLeft':  'left',
    'ArrowRight': 'right',
  };
  const newDir = map[e.key];
  if (!newDir) return;

  // 不允许 180° 掉头
  const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
  if (newDir === opposites[direction]) return;

  nextDirection = newDir;
});

// ======================== 触屏方向键 ========================
document.querySelectorAll('.dpad-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const dir = btn.dataset.dir;
    if (!gameRunning || isGameOver) return;
    const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
    if (dir === opposites[direction]) return;
    nextDirection = dir;
  });
});

// ======================== 启动 ========================
initGame();
gameRunning = true;
draw();
gameLoop = setInterval(tick, TICK_INTERVAL_MS);
</script>
</body>
</html>
